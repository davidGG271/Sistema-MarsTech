name: E2E Playwright Tests

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      working-directory: ./mars-tech-testing
      run: npm ci
      
    - name: Install Playwright Browsers
      working-directory: ./mars-tech-testing
      run: npx playwright install --with-deps chromium
      
    - name: Start local web server
      run: |
        npx -y http-server . -p 8080 -c-1 &
        sleep 5
      
    - name: Run Playwright tests
      working-directory: ./mars-tech-testing
      run: npx bddgen && npx playwright test --project=chromium --workers=1
      
    - name: Extraer evidencias limpias
      working-directory: ./mars-tech-testing
      if: always()
      run: node extraer-evidencias.js

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ./mars-tech-testing/playwright-report/
        retention-days: 30

    - name: Upload Evidencias de Fallos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Detalle de Fallos
        path: ./mars-tech-testing/Evidencias_Fallos/
        retention-days: 30

    - name: Upload Evidencias de Exitos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Detalle de Éxitos
        path: ./mars-tech-testing/Evidencias_Exitos/
        retention-days: 30
